# /etc/cpu-power-mqtt.conf

[general]
# Hur ofta värden skickas till Home Assistant (sekunder)
interval = 5
# Gränser för effekttaket i HA (W). TDP är 140 W men överklockad drar den mer.
power_limit_min = 30
power_limit_max = 220
# Profil som sätts när tjänsten startar (lämna tomt för att inte ändra något)
startup_profile = Balans
# Återställ ursprungliga inställningar när tjänsten stoppas
restore_on_exit = true

[mqtt]
host = 192.168.1.10
port = 1883
username = cpupower
password = byt-mig
tls = false

[homeassistant]
device_name = Server CPU
# node_id = minserver          (standard: datorns hostname)
discovery_prefix = homeassistant

# ---------------------------------------------------------------
# Profiler – visas som "Profil" i HA. max_freq = 0 betyder hårdvarans max.
# E5-1660 v3: 1200 MHz min, 3000 MHz bas, turbo/OC upp till 4000 MHz.
# governor: schedutil för drivrutinen intel_cpufreq (powersave låser då på lägsta frekvens).
# ---------------------------------------------------------------
[profile Eco]
max_freq = 1800
turbo = off
power_limit = 50
governor = schedutil

[profile Balans]
max_freq = 3000
turbo = off
power_limit = 90
governor = schedutil

[profile Max]
max_freq = 0
turbo = on
power_limit = 220
governor = schedutil
